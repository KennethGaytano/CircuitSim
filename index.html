<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CircuitSim</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- HEADER: the top menu (#top) and the sub menu (#sub) are filled by nav() in app.js -->
<header><div class="top"><div class="logo"><i></i>CircuitSim</div><div id="top" style="display:flex;gap:2px"></div></div><div class="sub" id="sub"></div></header>
<!-- MAIN: every page is drawn into this element by render() in app.js. The site is one HTML file that swaps its content. -->
<main id="main"></main>
<!-- All the logic is in js/app.js. It is a normal script, so you can double-click this file to open it. -->
<script src="js/app.js"></script>
</body>
</html>
